bookdown::bs4_book:
  theme:
    primary: "#1B4F72"
    fg: "#243447"
    bg: "#FFFFFF"
  # Estilos y cabecera generados desde R (R/estilos.R).
  css: !expr source("R/estilos.R")$value$css
  includes:
    in_header: !expr source("R/estilos.R")$value$cabecera
  repo:
    base: https://github.com/Nataly-Cardenas/Telco_Churn_Bookdown
    branch: main
  md_extensions: +lists_without_preceding_blankline-fancy_lists
