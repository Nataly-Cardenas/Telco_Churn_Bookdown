name: Publicar libro Bookdown

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Configurar Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar paquetes de R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::bookdown, any::rmarkdown, any::knitr, any::htmltools, any::bslib, any::downlit, any::xml2,
            any::readr, any::dplyr, any::tidyr, any::purrr, any::stringr, any::tibble, any::plotly,
            any::digest, any::moments, any::jsonlite, any::ggplot2, any::patchwork, any::tidymodels,
            any::glmnet, any::kableExtra, any::shapviz

      - name: Construir libro
        run: Rscript construir_libro.R

      - name: Subir libro
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
