<div class="eda-table" id="pp-tabla-1"><span class="eda-table-title">y_train.value_counts(normalize=True)</span><input aria-label="Buscar en y_train.value_counts(normalize=True)" placeholder="Buscar en esta tabla&#x2026;"><table class="dataframe"><thead><tr><th>Churn</th><th>proportion</th></tr></thead><tbody><tr><td>0</td><td>0.734647</td></tr><tr><td>1</td><td>0.265353</td></tr></tbody></table><p class="eda-table-note">Name: proportion, dtype: float64</p></div><script>(function(){const root=document.getElementById('pp-tabla-1');
    const body=root.querySelector('tbody'),input=root.querySelector('input');
    input.addEventListener('input',()=>{for(const r of body.rows)r.hidden=!r.textContent.toLowerCase().includes(input.value.toLowerCase());});
    root.querySelectorAll('thead th').forEach((h,i)=>{let asc=true;h.tabIndex=0;h.title='Ordenar columna';
    const sort=()=>{const rows=Array.from(body.rows);rows.sort((a,b)=>{const x=a.cells[i].textContent,y=b.cells[i].textContent;
    const nx=Number(x.replaceAll(',','')),ny=Number(y.replaceAll(',',''));
    const c=(x!=='\u2014'&&y!=='\u2014'&&Number.isFinite(nx)&&Number.isFinite(ny))?nx-ny:x.localeCompare(y,'es');return asc?c:-c;});
    rows.forEach(r=>body.appendChild(r));asc=!asc;};h.addEventListener('click',sort);h.addEventListener('keydown',e=>{if(e.key==='Enter')sort();});});})();</script>
