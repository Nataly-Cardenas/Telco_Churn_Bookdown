<div class="eda-table" id="pp-tabla-2"><span class="eda-table-title">Nulos en TotalCharges</span><input aria-label="Buscar en Nulos en TotalCharges" placeholder="Buscar en esta tabla…"><table class="dataframe"><thead><tr><th>Conjunto</th><th>Antes de imputar</th><th>Después de imputar</th></tr></thead><tbody><tr><td>train</td><td>8</td><td>0</td></tr><tr><td>test</td><td>3</td><td>0</td></tr></tbody></table></div><script>(function(){const root=document.getElementById('pp-tabla-2');
    const body=root.querySelector('tbody'),input=root.querySelector('input');
    input.addEventListener('input',()=>{for(const r of body.rows)r.hidden=!r.textContent.toLowerCase().includes(input.value.toLowerCase());});
    root.querySelectorAll('thead th').forEach((h,i)=>{let asc=true;h.tabIndex=0;h.title='Ordenar columna';
    const sort=()=>{const rows=Array.from(body.rows);rows.sort((a,b)=>{const x=a.cells[i].textContent,y=b.cells[i].textContent;
    const nx=Number(x.replaceAll(',','')),ny=Number(y.replaceAll(',',''));
    const c=(x!=='—'&&y!=='—'&&Number.isFinite(nx)&&Number.isFinite(ny))?nx-ny:x.localeCompare(y,'es');return asc?c:-c;});
    rows.forEach(r=>body.appendChild(r));asc=!asc;};h.addEventListener('click',sort);h.addEventListener('keydown',e=>{if(e.key==='Enter')sort();});});})();</script>
